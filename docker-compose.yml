# Ambiente de HOMOLOGAÇÃO/DESENVOLVIMENTO de referência.
# STATUS: escrito, NÃO executado neste ambiente de desenvolvimento (Docker indisponível). Validar antes do uso.
# Produção: usar orquestrador/infra gerenciada, TLS na borda (proxy reverso), segredos em cofre, backups, e
# expor publicamente SOMENTE: n8n /webhook/whatsapp (Meta) e core /verificacao/* (página de verificação reforçada).
name: hotel-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: hotel_agent
      # Mensagens contêm acentos e emojis: UTF8 obrigatório (a migração recusa outra codificação).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hotel_agent"]
      interval: 10s
      retries: 10
    networks: [interna]

  core-migracao:
    build: { context: ., dockerfile: services/core/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hotel_agent
    command: ["node", "scripts/migrate.js", "--sem-papeis"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [interna]
    restart: "no"

  core:
    build: { context: ., dockerfile: services/core/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hotel_agent
      REPO_DRIVER: postgres
    depends_on:
      core-migracao: { condition: service_completed_successfully }
    expose: ["8080"]
    networks: [interna]
    read_only: true
    security_opt: ["no-new-privileges:true"]

  n8n:
    # Versão usada na validação local dos workflows. Fixe a versão; atualize de forma controlada.
    image: docker.n8n.io/n8nio/n8n:2.44.7
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina no .env}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?URL pública HTTPS do n8n}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168" # horas — execuções podem conter dados pessoais; manter curto
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_RUNNERS_TASK_TIMEOUT: "60"
    ports: ["127.0.0.1:5678:5678"] # publicar via proxy reverso com TLS
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres: { condition: service_healthy }
    networks: [interna]

volumes:
  pgdata:
  n8ndata:

networks:
  interna:
